name: Save Birthday Data

on:
  repository_dispatch:
    types: [save-data]

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Save data
        run: |
          echo '${{ github.event.client_payload.data }}' > data/birthdays.json
      - name: Commit and push
        run: |
          git config user.name "Birthday Bot"
          git config user.email "bot@birthday.app"
          git add data/birthdays.json
          git diff --staged --quiet || git commit -m "Update birthdays"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_TOKEN }}
